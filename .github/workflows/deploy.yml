name: Build and Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push backend
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/my-project-terra-backend:latest ./backend
          docker push ${{ env.ECR_REGISTRY }}/my-project-terra-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/my-project-terra-frontend:latest ./frontend
          docker push ${{ env.ECR_REGISTRY }}/my-project-terra-frontend:latest

      - name: Force new ECS deployment - backend
        run: |
          aws ecs update-service \
            --cluster my-project-terra-cluster \
            --service my-project-terra-backend-service \
            --force-new-deployment

      - name: Force new ECS deployment - frontend
        run: |
          aws ecs update-service \
            --cluster my-project-terra-cluster \
            --service my-project-terra-frontend-service \
            --force-new-deployment